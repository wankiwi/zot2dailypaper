name: Send emails daily
on:
  workflow_dispatch:
    inputs:
      output:
        description: Email delivery (legacy values are accepted but RSS stays disabled)
        type: choice
        options: [configured, email, rss, both]
        default: email
      window_days:
        description: Lookback in days (1-90); blank uses preset windows
        type: string
        default: ''
      recipient:
        description: Optional email recipient for this run; blank uses existing configuration
        type: string
        default: ''
      sources:
        description: Sources for this run; overrides CUSTOM_CONFIG when not configured
        type: choice
        options: [configured, all, journals]
        default: configured
      preprint_profile:
        description: Preprint directions; interests uses the saved profile and disables medRxiv
        type: choice
        options: [configured, interests]
        default: configured
      llm_mode:
        description: Keep configured LLM behavior or use original abstracts without LLM calls
        type: choice
        options: [configured, disabled]
        default: configured
  schedule:
    - cron: '17 19 * * *' # 19:17 UTC / 03:17 next day Asia/Singapore; GitHub schedules may be delayed.
concurrency:
  group: daily-papers
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # Persist deduplication history to paper-state.
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Restore delivery history
        run: uv run --frozen python scripts/workflow_state.py restore
      - name: Prepare runtime configuration
        env:
          PAPER_CONFIG: ${{ vars.PAPER_CONFIG || 'all' }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
          OUTPUT_CHANNEL: email
          WINDOW_DAYS: ${{ inputs.window_days || '' }}
          RECEIVER_OVERRIDE: ${{ inputs.recipient || '' }}
          SOURCE_MODE: ${{ inputs.sources || 'configured' }}
          PREPRINT_PROFILE: ${{ inputs.preprint_profile || 'configured' }}
          LLM_MODE: ${{ inputs.llm_mode || 'configured' }}
          ZOTERO_WORKER_SYNC: ${{ vars.ZOTERO_WORKER_SYNC || 'disabled' }}
        run: uv run --frozen python scripts/prepare_workflow.py
      - name: Check private cache eligibility
        if: ${{ github.repository == 'wankiwi/zot2dailypaper' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        id: embedding-cache-gate
        env:
          EMBEDDING_CACHE_KEY: ${{ secrets.EMBEDDING_CACHE_KEY }}
        run: uv run --frozen python scripts/embedding_cache_state.py gate
      - name: Restore encrypted embedding package
        if: ${{ steps.embedding-cache-gate.outputs.enabled == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: .embedding-cache/private.enc
          key: embedding-private-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: embedding-private-v1-${{ runner.os }}-
      - name: Authenticate private embedding cache
        if: ${{ steps.embedding-cache-gate.outputs.enabled == 'true' }}
        env:
          EMBEDDING_CACHE_KEY: ${{ secrets.EMBEDDING_CACHE_KEY }}
        run: uv run --frozen python scripts/embedding_cache_state.py restore
      - name: Retrieve, rank and deliver
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SMTP_SERVER: ${{ vars.SMTP_SERVER || 'smtp.qq.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          OPENREVIEW_USERNAME: ${{ secrets.OPENREVIEW_USERNAME }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE || secrets.OPENAI_API_BASE || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          RSS_SITE_URL: ${{ vars.RSS_SITE_URL }}
          ZOTERO_WORKER_D1_TOKEN: ${{ secrets.ZOTERO_WORKER_D1_TOKEN }}
        run: uv run --frozen python -m zot2dailypaper.main --config-name=runtime
      - name: Save successful and pending deliveries
        if: ${{ always() && !cancelled() }}
        run: uv run --frozen python scripts/workflow_state.py save
      - name: Seal private embedding cache
        id: seal-embedding-cache
        if: ${{ always() && !cancelled() && steps.embedding-cache-gate.outputs.enabled == 'true' }}
        env:
          EMBEDDING_CACHE_KEY: ${{ secrets.EMBEDDING_CACHE_KEY }}
        run: uv run --frozen python scripts/embedding_cache_state.py save
      - name: Save encrypted embedding package
        if: ${{ always() && !cancelled() && steps.seal-embedding-cache.outputs.saved == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .embedding-cache/private.enc
          key: embedding-private-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
