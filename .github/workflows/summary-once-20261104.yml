name: Public pricing format diagnosis 20261104
on:
  push:
    branches: ['fix/summary-smoke-20261104']
    paths: ['.github/workflows/summary-once-20261104.yml']
permissions:
  contents: read
jobs:
  public-pricing:
    if: >-
      ${{ github.event.before == 'bcc6f50e3ca3b7018570c15330767f73fd4817c7' &&
          github.event.head_commit.message == 'Inspect public pricing headers 20261104-c' &&
          github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Inspect only public price table structure
        run: |
          uv run --frozen python - <<'PY'
          from hashlib import sha256
          from zot2dailypaper import openai_pricing as p
          text = p._fetch(p.PRICE_URL)
          print('PUBLIC_SOURCE_SHA256', sha256(text.encode()).hexdigest())
          print('PUBLIC_SOURCE_BYTES', len(text.encode()))
          lines = text.splitlines()
          hits = [i for i, line in enumerate(lines) if i < 180 and ('gpt-6-luna' in line or not line.startswith('| gpt-'))]
          for i in sorted({j for i in hits for j in range(max(0, i-2), min(len(lines), i+2))}):
              print('PUBLIC_LINE', i+1, repr(lines[i][:3000]))
          try:
              print('PARSED_QUOTE', p.parse_prices(text))
          except p.QuoteUnavailable as exc:
              print('SAFE_QUOTE_ERROR', str(exc))
          PY
