name: Pricing guard regressions 20261104
on:
  push:
    branches: ['fix/summary-smoke-20261104']
    paths: ['.github/workflows/summary-once-20261104.yml']
permissions:
  contents: read
jobs:
  isolated-tests:
    if: >-
      ${{ github.event.before == 'df4b0d3d45e190f2c44707a16177fcae49caa00e' &&
          github.event.head_commit.message == 'Require complete tiers in both pricing formats' &&
          github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Run complete isolated regression suite without credentials
        run: uv run --frozen pytest
