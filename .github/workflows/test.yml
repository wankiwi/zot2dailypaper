name: Test
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Isolated experiment only on this test branch
        type: choice
        options: [tests]
        default: tests
      collection_name_sha256:
        description: Unused compatibility input; leave empty
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: openai-shadow-20261029
  cancel-in-progress: false
jobs:
  isolated-experiment:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/experiment/openai-shadow-20261029' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Only test-branch budget reservation; never main or paper-state.
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test generic runner with synthetic data only
        run: python -m unittest discover -s experiments/openai_shadow -p 'test_public.py' -v
      - name: Check public-data approval and run one durably reserved experiment
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEY_ISSUER: https://api.openai.com
          OPENAI_API_BASE: https://api.openai.com/v1
        run: |
          umask 077
          python experiments/openai_shadow/runner.py
      - name: Retain sanitized accounting and approved public-input results only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: shadow-result-${{ github.run_id }}
          path: ${{ runner.temp }}/shadow-output/
          retention-days: 1
          if-no-files-found: ignore
