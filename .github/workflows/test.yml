name: Test
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Isolated tests, OpenReview checks, or one guarded paid LLM summary (no email)
        type: choice
        options: [tests, openreview, openreview_full, llm, zotero_readonly]
        default: tests
      collection_name_sha256:
        description: SHA256 of the exact target collection name (read-only inspection)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  isolated-tests:
    if: ${{ inputs.mode == 'tests' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run isolated tests without delivery credentials
        run: uv run --frozen pytest
  openreview-validation:
    if: ${{ inputs.mode == 'openreview' || inputs.mode == 'openreview_full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Validate official login and public submissions only
        env:
          OPENREVIEW_USERNAME: ${{ secrets.OPENREVIEW_USERNAME }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
        run: |
          if [ "${{ inputs.mode }}" = "openreview_full" ]; then
            uv run --frozen python scripts/diagnose_openreview.py
          else
            uv run --frozen python scripts/validate_openreview.py
          fi
  llm-validation:
    if: ${{ inputs.mode == 'llm' }}
    concurrency:
      group: daily-papers
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Only the durable daily budget and public pricing receipt are updated.
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Restore last verified LLM pricing
        run: uv run --frozen python scripts/workflow_state.py restore-pricing
      - name: Validate one Chinese summary without delivery
        env:
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run --frozen python scripts/validate_llm.py
      - name: Preserve verified LLM pricing
        if: ${{ always() && !cancelled() }}
        run: uv run --frozen python scripts/workflow_state.py save-pricing

  zotero-readonly-inspection:
    if: ${{ inputs.mode == 'zotero_readonly' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Read permission names and target collection existence only
        env:
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          TARGET_COLLECTION_SHA256: ${{ inputs.collection_name_sha256 }}
        run: uv run --frozen python scripts/inspect_zotero_access.py
