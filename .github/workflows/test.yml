name: Test
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Public-source capture only; no Zotero, model inference or email
        type: choice
        options: [tests, public_sources]
        default: tests
permissions:
  contents: read
jobs:
  source-controls:
    if: ${{ inputs.mode == 'tests' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Offline controls only
        env:
          PYTHONPATH: src
        run: uv run --frozen python -m unittest discover -s experiments/jina_blind_sources -p 'test_*.py'
  public-source-capture:
    if: ${{ inputs.mode == 'public_sources' && github.ref == 'refs/heads/experiment/jina-blind-source-20261104' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: jina-blind-public-source-20261104
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 1
        with:
          persist-credentials: false
      - name: Read existing delivery identities
        uses: actions/checkout@v6
        timeout-minutes: 1
        with:
          ref: paper-state
          path: history_readonly
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        timeout-minutes: 1
      - name: Install locked dependencies
        timeout-minutes: 4
        run: uv sync --frozen
      - name: Offline controls without service credentials
        timeout-minutes: 1
        env:
          PYTHONPATH: src
        run: uv run --frozen python -m unittest discover -s experiments/jina_blind_sources -p 'test_*.py'
      - name: Capture public metadata and seal checkpoints
        timeout-minutes: 32
        env:
          JINA_BLIND_SOURCE_INPUT: ${{ secrets.JINA_BLIND_SOURCE_INPUT }}
          OPENREVIEW_USERNAME: ${{ secrets.OPENREVIEW_USERNAME }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          HISTORY_FILE: ${{ github.workspace }}/history_readonly/recommendations.json
          SEALED_OUTPUT: ${{ github.workspace }}/sealed/public-sources.sealed.json
          PYTHONPATH: src
        run: exec .venv/bin/python experiments/jina_blind_sources/capture_public.py 3>&1 > /dev/null 2>&1
      - name: Preserve ciphertext only
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: jina-blind-public-sealed-${{ github.run_id }}
          path: sealed/public-sources.sealed.json
          if-no-files-found: warn
          retention-days: 1
      - name: Remove throwaway local delivery-history checkout
        if: ${{ always() }}
        timeout-minutes: 1
        run: rm -rf history_readonly
